openapi: '3.0.3'
info:
  title: CAB System API - Trips
  description: 'Quản lý chuyến đi & Đặt xe'
  version: '1.0.0'
  contact:
    name: Vo Thi Tuyet Ngan
    email: support@cab-system.com
servers:
  - url: https://api.cab-system.com/v1
    description: Production Server
  - url: http://localhost:8080/v1
    description: Development Server
tags:
  - name: Trips
    description: 'Quản lý chuyến đi & Đặt xe'
paths:
  '/trips':
    get:
      tags:
        - Trips
      summary: 'Tra cứu lịch sử / danh sách chuyến đi'
      operationId: getTrips
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
        - Trips
      summary: 'Tạo mới yêu cầu đặt xe'
      operationId: createTrip
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: 'Tạo yêu cầu đặt xe thành công'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
  '/trips/{trip_id}':
    get:
      tags:
        - Trips
      summary: 'Xem thông tin chi tiết chuyến đi'
      operationId: getTripDetails
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
    put:
      tags:
        - Trips
      summary: 'Cập nhật trạng thái chuyến đi (Nhận chuyến/Từ chối/Đón/Hoàn thành)'
      operationId: updateTripState
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Cập nhật thành công'
    delete:
      tags:
        - Trips
      summary: 'Hủy chuyến đi'
      operationId: cancelTrip
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Đã hủy chuyến đi thành công'
  '/trips/{trip_id}/rating':
    post:
      tags:
        - Trips
      summary: 'Đánh giá tài xế'
      operationId: rateDriver
      security:
        - BearerAuth: []
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: 'Đã ghi nhận đánh giá'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
          example: '0987654321'
        password:
          type: string
          example: '123456'
        full_name:
          type: string
          example: Vo Thi Tuyet Ngan
        role:
          type: string
          example: CUSTOMER
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          example: '0987654321'
        password:
          type: string
          example: '123456'
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOi...
        user_id:
          type: string
          example: usr_001
    UserProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        phone:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
    DriverProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        license_number:
          type: string
    Vehicle:
      type: object
      properties:
        plate_number:
          type: string
        brand:
          type: string
        model:
          type: string
    CreateTripRequest:
      type: object
      properties:
        pickup_address:
          type: string
        dropoff_address:
          type: string
        vehicle_type:
          type: string
    Trip:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        pickup_address:
          type: string
        dropoff_address:
          type: string
        fare_amount:
          type: number
    Transaction:
      type: object
      properties:
        id:
          type: string
        trip_id:
          type: string
        amount:
          type: number
        status:
          type: string
