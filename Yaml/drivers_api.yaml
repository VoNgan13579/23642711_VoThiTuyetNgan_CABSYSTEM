openapi: '3.0.3'
info:
  title: CAB System API - Drivers
  description: 'Quản lý tài xế & phương tiện'
  version: '1.0.0'
  contact:
    name: Vo Thi Tuyet Ngan
    email: support@cab-system.com
servers:
  - url: https://api.cab-system.com/v1
    description: Production Server
  - url: http://localhost:8080/v1
    description: Development Server
tags:
  - name: Drivers
    description: 'Quản lý tài xế & phương tiện'
paths:
  '/drivers/profile':
    get:
      tags:
        - Drivers
      summary: 'Xem hồ sơ tài xế'
      operationId: getDriverProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
    put:
      tags:
        - Drivers
      summary: 'Cập nhật hồ sơ tài xế'
      operationId: updateDriverProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfile'
      responses:
        '200':
          description: 'Cập nhật hồ sơ thành công'
  '/drivers/vehicle':
    get:
      tags:
        - Drivers
      summary: 'Xem thông tin phương tiện'
      operationId: getVehicleInfo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    put:
      tags:
        - Drivers
      summary: 'Cập nhật thông tin phương tiện'
      operationId: updateVehicleInfo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
      responses:
        '200':
          description: 'Cập nhật phương tiện thành công'
  '/drivers/status':
    put:
      tags:
        - Drivers
      summary: 'Cập nhật trạng thái sẵn sàng nhận chuyến'
      operationId: updateDriverStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Cập nhật trạng thái thành công'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
          example: '0987654321'
        password:
          type: string
          example: '123456'
        full_name:
          type: string
          example: Vo Thi Tuyet Ngan
        role:
          type: string
          example: CUSTOMER
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          example: '0987654321'
        password:
          type: string
          example: '123456'
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOi...
        user_id:
          type: string
          example: usr_001
    UserProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        phone:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
    DriverProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        license_number:
          type: string
    Vehicle:
      type: object
      properties:
        plate_number:
          type: string
        brand:
          type: string
        model:
          type: string
    CreateTripRequest:
      type: object
      properties:
        pickup_address:
          type: string
        dropoff_address:
          type: string
        vehicle_type:
          type: string
    Trip:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        pickup_address:
          type: string
        dropoff_address:
          type: string
        fare_amount:
          type: number
    Transaction:
      type: object
      properties:
        id:
          type: string
        trip_id:
          type: string
        amount:
          type: number
        status:
          type: string
