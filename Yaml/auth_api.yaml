openapi: '3.0.3'
info:
  title: CAB System API - Auth
  description: 'Xác thực & Phân quyền'
  version: '1.0.0'
  contact:
    name: Vo Thi Tuyet Ngan
    email: support@cab-system.com
servers:
  - url: https://api.cab-system.com/v1
    description: Production Server
  - url: http://localhost:8080/v1
    description: Development Server
tags:
  - name: Auth
    description: 'Xác thực & Phân quyền'
paths:
  '/auth/register':
    post:
      tags:
        - Auth
      summary: 'Đăng ký tài khoản mới (Khách hàng / Tài xế)'
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 'Tạo tài khoản thành công'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 'Thông tin không hợp lệ hoặc tài khoản đã tồn tại'
  '/auth/login':
    post:
      tags:
        - Auth
      summary: 'Đăng nhập hệ thống'
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Đăng nhập thành công'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 'Sai thông tin đăng nhập'
  '/auth/logout':
    post:
      tags:
        - Auth
      summary: 'Đăng xuất khỏi hệ thống'
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'Đăng xuất thành công'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
          example: '0987654321'
        password:
          type: string
          example: '123456'
        full_name:
          type: string
          example: Vo Thi Tuyet Ngan
        role:
          type: string
          example: CUSTOMER
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          example: '0987654321'
        password:
          type: string
          example: '123456'
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOi...
        user_id:
          type: string
          example: usr_001
    UserProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        phone:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
    DriverProfile:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        license_number:
          type: string
    Vehicle:
      type: object
      properties:
        plate_number:
          type: string
        brand:
          type: string
        model:
          type: string
    CreateTripRequest:
      type: object
      properties:
        pickup_address:
          type: string
        dropoff_address:
          type: string
        vehicle_type:
          type: string
    Trip:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        pickup_address:
          type: string
        dropoff_address:
          type: string
        fare_amount:
          type: number
    Transaction:
      type: object
      properties:
        id:
          type: string
        trip_id:
          type: string
        amount:
          type: number
        status:
          type: string

